name: Guest app quality

on:
  pull_request:
  push:
    branches: [main, 'sale/**']

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run lint, TypeScript, and unit tests
        run: npm run quality
      # Cross-repository verification runs in private API CI against a pinned
      # public Guest verifier. No private source or cross-repo token is exposed.
      # Local buyer check: TBL_API_ROOT=../the_tbl_api-revamp npm run test:contract
      - name: Build the guest app
        env:
          VITE_API_BASE_URL: https://api.example.invalid
        run: npm run build
      - name: Install browser dependencies
        run: npx playwright install --with-deps chrome
      - name: Run browser integration tests (intercepted API fixtures)
        run: npm run test:e2e
